packages:
  - packages/*

engineStrict: true

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

catalogs:
  dev:
    '@types/node': ^24.11.0
    eslint: ^10.1.0
    oxfmt: ^0.59.0
    oxlint: ^1.74.0
    oxlint-tsgolint: ^0.24.0
    tsdown: ^0.21.6
    vitest: ^4.1.2

minimumReleaseAgeExclude:
  - '@oxlint-config-inspector/core@1.1.5'
  - oxlint-config-inspector@1.1.5
